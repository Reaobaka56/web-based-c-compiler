services:
  - type: web
    name: cpppad-live
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://web-based-c-compiler.vercel.app,https://<your-custom-domain>
